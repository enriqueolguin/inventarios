{% extends "base.html" %}

{% block title %}Cambiar contraseña{% endblock %}

{% block contenido %}
<section class="tarjeta-seccion tarjeta-formulario tarjeta-angosta">
  <div class="cabecera-seccion">
    <h2>🔑 Cambiar mi contraseña</h2>
    <a href="{{ url_for('index') }}" class="btn btn-neutro">← Volver</a>
  </div>

  <form method="POST" class="form-equipos" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="campo">
      <label for="password_actual">Contraseña actual *</label>
      <input type="password" id="password_actual" name="password_actual" required
             autocomplete="current-password" placeholder="Tu contraseña actual">
    </div>

    <div class="campo">
      <label for="password_nueva">Nueva contraseña * (mín. 8 caracteres)</label>
      <input type="password" id="password_nueva" name="password_nueva" required
             minlength="8" autocomplete="new-password"
             placeholder="Mínimo 8 caracteres">
    </div>

    <div class="campo">
      <label for="password_confirmar">Confirmar nueva contraseña *</label>
      <input type="password" id="password_confirmar" name="password_confirmar" required
             minlength="8" autocomplete="new-password"
             placeholder="Repite la nueva contraseña">
    </div>

    <div class="acciones-form">
      <button type="submit" class="btn btn-primario">🔒 Actualizar contraseña</button>
    </div>
  </form>
</section>
{% endblock %}
